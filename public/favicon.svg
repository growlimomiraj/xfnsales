<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D2EFF"/>
      <stop offset="100%" stop-color="#2B0A6E"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0745"/>
      <stop offset="100%" stop-color="#0E0326"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border for premium depth -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Antenna angled rays -->
  <path d="M26 15 L21 9" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 15 L43 9" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="21" cy="9" r="1.5" fill="#E879F9"/>
  <circle cx="43" cy="9" r="1.5" fill="#A78BFA"/>

  <!-- TV Outer Frame -->
  <rect x="11" y="15" width="42" height="30" rx="6" fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- TV Screen Stand / Base -->
  <path d="M27 45 L25 51 H39 L37 45" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signal / Broadcast Waves Inside Screen -->
  <!-- Center Signal Dot -->
  <circle cx="26" cy="30" r="2.5" fill="#FFFFFF"/>
  
  <!-- Inner Wave Arc -->
  <path d="M31 25.5 C33.5 28 33.5 32 31 34.5" fill="none" stroke="url(#signalGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Outer Wave Arc -->
  <path d="M36 22 C40.5 26.5 40.5 33.5 36 38" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
</svg>
